# Dataset registry: where each dataset lives and how its labels are stored.
# Used by data.py (config key `dataset_registry`). Select one with --dataset <name>.
#
# Every dataset becomes ONE pool of labelled images, which is then split per class
# into train / val with `val_split` (seeded, stratified). With merge_splits: true
# (config.yaml) the train/ and test/ (val/, valid/) folders of a folder dataset are
# pooled before that split.
#
# format: folder  -> <path>/[train|test|val]/<class>/*.jpg, or <path>/<class>/*.jpg
# format: fiftyone -> <path>/samples.json of a FiftyOne export; label = <label_field>.label,
#     filter: {field: value} keeps matching samples only, split_field / val_splits give the
#     official split used as validation when merge_splits is false
# format: csv     -> <path>/<csv> lists the images in <path>/<image_dir>:
#     label_cols: [a, b, ...]   one-hot columns, the class is the column holding 1
#     label_col: name           one label column; a space-separated multi-label value
#                               ("scab frog_eye_leaf_spot") becomes the class "scab+frog_eye_leaf_spot"
#     label_map: file.json      optional {"0": "name", ...} for integer labels
#     image_ext: .jpg           appended when the CSV ids have no extension
#
# Kaggle test sets (plant-pathology-*/test*, cassava test_images) have no labels,
# so only the labelled train CSV is used.

root: "D:/D/my docs/my docs/ideas/attention based works/Loop Transformers/Topoly axis innovation ideas for loop vits/design A loop carried graph attention/code repo/dataset"

datasets:
  plant-pathology-2020:          # FGVC7: 1821 images, 4 classes (healthy, multiple_diseases, rust, scab)
    path: plant-pathology-2020-fgvc7
    format: csv
    csv: train.csv
    image_dir: images
    image_col: image_id
    image_ext: .jpg
    label_cols: [healthy, multiple_diseases, rust, scab]

  plant-pathology-2021:          # FGVC8: 18632 images, 12 classes (6 single diseases + 6 combinations)
    path: plant-pathology-2021-fgvc8
    format: csv
    csv: train.csv
    image_dir: train_images
    image_col: image
    label_col: labels

  cassava:                       # 21397 images, 5 classes
    path: cassava-leaf-disease-classification
    format: csv
    csv: train.csv
    image_dir: train_images
    image_col: image_id
    label_col: label
    label_map: label_num_to_disease_map.json

  plantdoc:                      # 27 classes, train/ + test/ pooled
    path: plantodc
    format: folder

  plantodc:                      # alias (the folder's own spelling)
    path: plantodc
    format: folder

  plantvillage:                  # 38 classes, flat
    path: plantvillage/color
    format: folder

  rice-leaf-bd:                  # RiceLeafDiseaseBD: 9769 images, 6 classes, 1024x1024 (see DATASET_INFO.md there)
    # "Original images" (clean photos), not "Annotated images": the annotated visuals have
    # red bounding boxes drawn on them (a shortcut the model would learn), the annotated
    # set has no Healthy class, and its YOLO box labels are for detection, not classification.
    path: "D:/D/my docs/my docs/ideas/attention based works/Datasets/RiceLeafDiseaseBD/RiceLeafDiseaseBD/Original images"
    format: folder

  paddy:                         # Paddy Doctor (Kaggle paddy-disease-classification): 10407 images, 10 classes
    # train_images/<class>/ is labelled; test_images/ (3469) has no labels and is not used.
    # train.csv repeats the labels and adds rice variety and plant age (not used for training).
    path: "D:/D/my docs/my docs/ideas/attention based works/Datasets/paddy-disease-classification/train_images"
    format: folder

  plantwild:                     # PlantWild v1 (ACM MM 2024 paper version): 18542 images, 89 classes, in the wild
    # FiftyOne export of the Hugging Face dataset; see DATASET_INFO.md in that folder.
    # v1 only: v2 is a different taxonomy (115 disease-only classes) and must not be mixed in.
    path: "D:/D/my docs/my docs/ideas/attention based works/Datasets/PlantWild"
    format: fiftyone
    filter: {dataset_version: v1}
    label_field: ground_truth
    split_field: split           # official 70/10/20 train/val/test (pooled while merge_splits is true)
    val_splits: [test]

  plantwild-v2:                  # PlantWild v2 (expert-refined): 11488 images, 115 disease-only classes, no official split
    path: "D:/D/my docs/my docs/ideas/attention based works/Datasets/PlantWild"
    format: fiftyone
    filter: {dataset_version: v2}
    label_field: ground_truth
